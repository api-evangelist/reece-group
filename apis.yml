aid: reece-group

name: Reece Group

description: 'Reece Group (Reece Limited, ASX: REH) is a distributor of plumbing, waterworks, bathroom and HVAC-R products, operating around 800 branches across Australia, New Zealand and the United States and serving trade and consumer customers since 1920. Its brands include Reece (reece.com.au), Actrol, Viadux, Metalflex and, in the US, Reece USA and Fortiline. Its technology arm, ReeceTech, is based in Melbourne and publishes open-source repositories on GitHub. No public developer portal or API documentation was found on its sites.'

